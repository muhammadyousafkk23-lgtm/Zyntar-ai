<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zynthar AI - Next-Gen Video Generator</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #f3f4f6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-top: 40px;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        header p {
            color: #9ca3af;
            font-size: 1rem;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #111827;
            border: 1px solid #1f2937;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #d1d5db;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: #1f2937;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 1rem;
            resize: none;
            outline: none;
            transition: border-color 0.3s;
        }

        textarea:focus {
            border-color: #8b5cf6;
        }

        .btn {
            width: 100%;
            background: linear-gradient(90deg, #8b5cf6, #3b82f6);
            color: white;
            border: none;
            padding: 14px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.3s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .output-section {
            margin-top: 30px;
            text-align: center;
        }

        .loader {
            display: none;
            width: 40px;
            height: 40px;
            border: 4px solid #374151;
            border-top: 4px solid #8b5cf6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .result-box {
            display: none;
            margin-top: 20px;
            background: #1f2937;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #374151;
        }

        .result-box p {
            color: #9ca3af;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Zynthar AI</h1>
        <p>Grok & Midjourney inspired next-gen generator</p>
    </header>

    <div class="container">
        <div class="input-group">
            <label for="prompt">Enter your video prompt</label>
            <textarea id="prompt" placeholder="A cinematic drone shot of a futuristic factory with massive machines processing metal..."></textarea>
        </div>

        <button class="btn" onclick="generateVideo()">Generate AI Video</button>

        <div class="loader" id="loader"></div>

        <div class="result-box" id="resultBox">
            <p>Your video generation request has been processed successfully!</p>
            <button class="btn" style="background: #10b981; margin-top: 10px;">Download / View Result</button>
        </div>
    </div>

    <script>
        function generateVideo() {
            const promptText = document.getElementById('prompt').value.trim();
            const loader = document.getElementById('loader');
            const resultBox = document.getElementById('resultBox');

            if (promptText === "") {
                alert("براہ کرم پہلے کوئی پرامپٹ (Prompt) درج کریں!");
                return;
            }

            // UI Reset
            loader.style.display = "block";
            resultBox.style.display = "none";

            // Simulating AI Processing
            setTimeout(() => {
                loader.style.display = "none";
                resultBox.style.display = "block";
            }, 3000);
        }
    </script>

</body>
</html>
